name: Daily BTC Data Update

on:
  schedule:
    - cron: '0 1 * * *' # දිනපතා UTC වෙලාවෙන් 01:00 ට Run වේ
  workflow_dispatch: # Manual run කිරීමට පහසුකම ලබා දෙයි

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas requests

      - name: Run Update Script
        run: python update_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.name "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update BTC data" || exit 0
          git push

